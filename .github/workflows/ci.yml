name: CI

# Locks in the structural fixes from P1 (single-source ISA spec),
# P2 (unified ONNX walker), and P3 (profile-based AcceleratorConfig).
# Any drift between compiler/isa_spec.py and rtl/i_decoder.sv, or any
# divergence between dram.save_all_initializers_to_dram and
# compile.generate_assembly's address lookups, breaks this build.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  ci:
    name: Compiler tests + ISA spec drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            compiler/requirements.txt
            test/cocotb_tests/requirements.txt

      - name: Install Python dependencies
        run: |
          # CPU-only torch keeps the install <300 MB and skips CUDA.
          pip install --index-url https://download.pytorch.org/whl/cpu \
              torch torchvision
          pip install numpy onnx onnxscript pytest

      - name: Show environment
        run: |
          python --version
          python -c "import torch, numpy, onnx; print('torch', torch.__version__, 'numpy', numpy.__version__, 'onnx', onnx.__version__)"
          pytest --version

      - name: Run CI tier (compiler pytest + ISA spec --check)
        run: make ci

      - name: Verify generate_config.py runs cleanly
        # The RTL pkg is gitignored; we verify the generator at least produces
        # a non-empty file with the expected SimProfile values.
        run: |
          make config
          test -s rtl/accelerator_config_pkg.sv
          grep -q 'TILE_ELEMS = 32' rtl/accelerator_config_pkg.sv

      - name: Verify the generator is idempotent
        # Two back-to-back runs must produce identical output — catches
        # accidental non-determinism (timestamps, set ordering, etc.) in
        # tools/generate_i_decoder.py.
        run: |
          python tools/generate_i_decoder.py
          cp rtl/i_decoder.sv /tmp/dec.first
          python tools/generate_i_decoder.py
          diff -u /tmp/dec.first rtl/i_decoder.sv
